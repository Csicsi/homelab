---
- name: Setup Pi-hole DNS Server
  hosts: homelab-mgmt
  become: true

  vars:
    pihole_home: /opt/pihole
    pihole_webpassword: "admin"
    pihole_timezone: "Europe/Vienna"
    pihole_dns1: "1.1.1.1"
    pihole_dns2: "1.0.0.1"
    pihole_web_port: 8080

  tasks:
    - name: Create pihole directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ pihole_home }}"
        - "{{ pihole_home }}/etc-pihole"
        - "{{ pihole_home }}/etc-dnsmasq.d"

    - name: Create docker-compose.yml for Pi-hole
      ansible.builtin.copy:
        content: |
          services:
            pihole:
              container_name: pihole
              image: pihole/pihole:latest
              ports:
                - "53:53/tcp"
                - "53:53/udp"
                - "{{ pihole_web_port }}:80/tcp"
              environment:
                TZ: "{{ pihole_timezone }}"
                WEBPASSWORD: "{{ pihole_webpassword }}"
                PIHOLE_DNS_: "{{ pihole_dns1 }};{{ pihole_dns2 }}"
                DNSMASQ_LISTENING: "all"
              volumes:
                - {{ pihole_home }}/etc-pihole:/etc/pihole
                - {{ pihole_home }}/etc-dnsmasq.d:/etc/dnsmasq.d
              restart: unless-stopped
        dest: "{{ pihole_home }}/docker-compose.yml"
        mode: "0644"

    - name: Check if systemd-resolved exists
      ansible.builtin.command: systemctl status systemd-resolved
      register: systemd_resolved_check
      failed_when: false
      changed_when: false

    - name: Stop systemd-resolved (conflicts with Pi-hole DNS)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      when: systemd_resolved_check.rc == 0

    - name: Create static resolv.conf
      ansible.builtin.copy:
        content: |
          nameserver {{ pihole_dns1 }}
          nameserver {{ pihole_dns2 }}
        dest: /etc/resolv.conf
        mode: "0644"

    - name: Start Pi-hole container
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ pihole_home }}"

    - name: Wait for Pi-hole to be ready
      ansible.builtin.wait_for:
        port: "{{ pihole_web_port }}"
        delay: 10
        timeout: 120

    - name: Open Pi-hole web port in firewall
      community.general.ufw:
        rule: allow
        port: "{{ pihole_web_port }}"
        proto: tcp

    - name: Open DNS port in firewall
      community.general.ufw:
        rule: allow
        port: "53"

    - name: Display Pi-hole access information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Pi-hole Setup Complete!"
          - "=========================================="
          - "Web Interface: http://{{ ansible_host }}:{{ pihole_web_port }}/admin"
          - "Password: {{ pihole_webpassword }}"
          - "DNS Server: {{ ansible_host }}"
          - ""
          - "NEXT STEPS:"
          - "1. Update router DNS to {{ ansible_host }}"
          - "2. Test DNS resolution from client devices"
          - "3. Change admin password from default"
          - "=========================================="
