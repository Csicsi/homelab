---
- name: Deploy monitoring stack (Prometheus + Grafana + Loki)
  hosts: services_host
  become: true

  vars:
    monitoring_dir: /srv/monitoring
    prometheus_port: 30090
    grafana_port: 30030
    loki_port: 3100
    grafana_admin_password: "admin" # change after first login

  tasks:
    - name: Create monitoring directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/loki"
      tags: setup

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node-exporter'
              static_configs:
                - targets:
                    - '192.168.8.10:9100'
      tags: prometheus

    - name: Write Loki config
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/loki/loki-config.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        content: |
          auth_enabled: false
          server:
            http_listen_port: 3100
          ingester:
            lifecycler:
              ring:
                kvstore:
                  store: inmemory
                replication_factor: 1
            wal:
              enabled: true
              dir: /loki/wal
          schema_config:
            configs:
              - from: 2024-01-01
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h
          storage_config:
            boltdb_shipper:
              active_index_directory: /loki/index
              cache_location: /loki/cache
            filesystem:
              directory: /loki/chunks
          limits_config:
            allow_structured_metadata: false
          compactor:
            working_directory: /loki/compactor
      tags: loki

    - name: Write monitoring docker compose file
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time=15d'
              ports:
                - "{{ prometheus_port }}:9090"

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              environment:
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
                - GF_USERS_ALLOW_SIGN_UP=false
                - GF_UNIFIED_ALERTING_ENABLED=true
              volumes:
                - grafana_data:/var/lib/grafana
              ports:
                - "{{ grafana_port }}:3000"
              depends_on:
                - prometheus

            loki:
              image: grafana/loki:latest
              container_name: loki
              restart: unless-stopped
              command:
                - -config.file=/etc/loki/loki-config.yml
                - -validation.allow-structured-metadata=false
              volumes:
                - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
                - loki_data:/loki
              ports:
                - "{{ loki_port }}:3100"

          volumes:
            prometheus_data:
            grafana_data:
            loki_data:
      tags: compose

    - name: Create node_exporter user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: node-exporter

    - name: Download node_exporter
      ansible.builtin.get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"
      tags: node-exporter

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: true
      tags: node-exporter

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter
      tags: node-exporter

    - name: Install node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter
      tags: node-exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true
      tags: node-exporter

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
        pull: always
      tags: compose

    - name: Open monitoring ports in firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ prometheus_port }}"
        - "{{ grafana_port }}"
        - "{{ loki_port }}"
        - "9100"
      tags: firewall

    - name: Display monitoring URLs
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://{{ ansible_host }}:{{ prometheus_port }}"
          - "Grafana: http://{{ ansible_host }}:{{ grafana_port }} (admin/{{ grafana_admin_password }})"
          - "Loki: http://{{ ansible_host }}:{{ loki_port }}"
      tags: verify

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
