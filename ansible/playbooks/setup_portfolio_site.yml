---
- name: Deploy Portfolio site from GitHub
  hosts: services_host
  become: true

  vars:
    portfolio_repo_url: "https://github.com/Csicsi/Portfolio.git"
    portfolio_branch: "main"
    portfolio_dir: "/srv/portfolio"
    portfolio_lan_http_only: true

  tasks:
    - name: Ensure portfolio directory exists
      ansible.builtin.file:
        path: "{{ portfolio_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Clone or update portfolio repository
      ansible.builtin.git:
        repo: "{{ portfolio_repo_url }}"
        dest: "{{ portfolio_dir }}"
        version: "{{ portfolio_branch }}"
        force: true
      become: false

    - name: Check for compose file (docker-compose.yml)
      ansible.builtin.stat:
        path: "{{ portfolio_dir }}/docker-compose.yml"
      register: compose_yml

    - name: Check for compose file (compose.yml)
      ansible.builtin.stat:
        path: "{{ portfolio_dir }}/compose.yml"
      register: compose_short

    - name: Check for compose file (compose.yaml)
      ansible.builtin.stat:
        path: "{{ portfolio_dir }}/compose.yaml"
      register: compose_short_yaml

    - name: Check for compose file (docker-compose.yaml)
      ansible.builtin.stat:
        path: "{{ portfolio_dir }}/docker-compose.yaml"
      register: compose_yaml

    - name: Determine compose file path
      ansible.builtin.set_fact:
        portfolio_compose_file: >-
          {{
            (portfolio_dir + '/docker-compose.yml') if compose_yml.stat.exists else
            (portfolio_dir + '/docker-compose.yaml') if compose_yaml.stat.exists else
            (portfolio_dir + '/compose.yml') if compose_short.stat.exists else
            (portfolio_dir + '/compose.yaml') if compose_short_yaml.stat.exists else
            ''
          }}

    - name: Fail if no compose file was found
      ansible.builtin.fail:
        msg: >-
          No compose file found in {{ portfolio_dir }}.
          Expected one of: docker-compose.yml, docker-compose.yaml, compose.yml, compose.yaml.
      when: portfolio_compose_file == ''

    - name: Stop temporary landing container if present
      ansible.builtin.shell:
        cmd: "docker rm -f homelab-landing || true"
      changed_when: false

    - name: Apply LAN HTTP-only Nginx config for portfolio
      ansible.builtin.copy:
        dest: "{{ portfolio_dir }}/nginx/default.conf"
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;

              # WebSocket proxy for minishell (root WebSocket connection)
              location = /minishell/ws {
                  proxy_pass http://minishell-api:3000/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }

              # API endpoints for minishell
              location /minishell/api/ {
                  proxy_pass http://minishell-api:3000/api/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  try_files $uri /index.html;
              }

              location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico)$ {
                  try_files $uri =404;
                  expires 30d;
                  access_log off;
              }
          }
      when: portfolio_lan_http_only

    - name: Deploy portfolio stack with Docker Compose
      ansible.builtin.command:
        cmd: "docker compose -f {{ portfolio_compose_file }} up -d --build"
        chdir: "{{ portfolio_dir }}"

    - name: Ensure HTTP/HTTPS are allowed in firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Display deployment info
      ansible.builtin.debug:
        msg:
          - "Portfolio deployed from {{ portfolio_repo_url }}"
          - "Directory: {{ portfolio_dir }}"
          - "Compose file: {{ portfolio_compose_file }}"
          - "Site URL: http://{{ ansible_host }}"
