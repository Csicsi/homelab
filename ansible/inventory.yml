---
all:
  children:
    routers:
      hosts:
        glinet-router:
          ansible_host: 192.168.8.1
          ansible_user: root
          ansible_become: false
          ansible_ssh_common_args: "-o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa"

    # Production Environment (Laptop @ 192.168.8.10)
    prod:
      hosts:
        homelab-laptop:
          ansible_host: 192.168.8.10
          ansible_user: dcsicsak
          ansible_become: true
          ansible_become_method: sudo

    # Staging Environment (Laptop @ 192.168.8.11 - brought up on demand)
    staging:
      hosts:
        homelab-staging:
          ansible_host: 192.168.8.11
          ansible_user: dcsicsak
          ansible_become: true
          ansible_become_method: sudo

    # Monitoring & Alerting (Optional Pi @ 192.168.8.20)
    monitoring:
      hosts:
        monitoring-pi:
          ansible_host: 192.168.8.20
          ansible_user: dcsicsak
          ansible_become: true
          ansible_become_method: sudo

    # Logical groupings for easier targeting
    servers:
      children:
        prod:
        staging:

    services_host:
      children:
        prod:
        staging:
